name: Deploy Lambda functions

on:
  push:
    branches: [main]
    paths:
      - "src/**"
  pull_request:
    branches: [main]
    paths:
      - "src/**"

permissions:
  id-token: write  # required for OIDC
  contents: read

jobs:
  deploy-dev:
    name: Deploy (dev)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Package and deploy Lambda functions (dev)
        env:
          ENV: dev
        run: |
          PREFIX="order-processing-system-${ENV}"

          zip -j create-order.zip src/create_order/index.py
          aws lambda update-function-code \
            --function-name "${PREFIX}-create-order" \
            --zip-file fileb://create-order.zip

          zip -j worker.zip src/worker/index.py
          aws lambda update-function-code \
            --function-name "${PREFIX}-worker" \
            --zip-file fileb://worker.zip

  deploy-prod:
    name: Deploy (prod)
    needs: deploy-dev
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production  # triggers manual approval gate
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Package and deploy Lambda functions (prod)
        env:
          ENV: prod
        run: |
          PREFIX="order-processing-system-${ENV}"

          zip -j create-order.zip src/create_order/index.py
          aws lambda update-function-code \
            --function-name "${PREFIX}-create-order" \
            --zip-file fileb://create-order.zip

          zip -j worker.zip src/worker/index.py
          aws lambda update-function-code \
            --function-name "${PREFIX}-worker" \
            --zip-file fileb://worker.zip
